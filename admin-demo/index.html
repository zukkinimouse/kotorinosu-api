<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>フードロス通知 | 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #fff9f5 0%, #fce8ec 100%);
      padding: 24px 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(220, 80, 120, 0.12);
      padding: 36px 28px;
      width: 100%;
      max-width: 520px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: #b5305a;
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 0.04em;
    }

    /* ---- 通知ブロック ---- */

    /* ブロック間の区切り線 */
    .notify-block + .notify-block {
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1.5px dashed #f0c0ce;
    }

    /* ブロック上部（削除ボタン行） */
    .block-top {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
      min-height: 24px;
    }

    .block-delete-btn {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #ccc;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.03em;
      transition: color 0.18s, background 0.18s;
    }

    .block-delete-btn:hover {
      color: #e91e8c;
      background: #fff0f5;
    }

    /* テキストエリア */
    .block-textarea {
      width: 100%;
      min-height: 180px;
      padding: 16px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 16px;
      line-height: 1.9;
      color: #333;
      background: #fff8fa;
      border: 2px solid #f0c0ce;
      border-radius: 12px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .block-textarea:focus {
      border-color: #e91e8c;
    }

    /* 送信エリア */
    .send-area {
      margin-top: 16px;
    }

    /* 送信ボタン */
    .send-btn {
      display: block;
      width: 100%;
      padding: 20px 16px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #f06292, #e91e8c);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(233, 30, 140, 0.30);
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.22s ease, max-height 0.22s ease, padding 0.22s ease;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.05em;
      overflow: hidden;
      max-height: 80px;
    }

    .send-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(233, 30, 140, 0.38);
    }

    .send-btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 3px 12px rgba(233, 30, 140, 0.25);
    }

    .send-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* 確認パネル表示中は送信ボタンを縮小して非表示 */
    .send-btn.hidden {
      opacity: 0;
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      pointer-events: none;
    }

    /* 確認パネル */
    .confirm-panel {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.25s ease;
    }

    .confirm-panel.visible {
      max-height: 400px;
      opacity: 1;
    }

    .confirm-inner {
      padding: 20px;
      background: #fff8fa;
      border: 1.5px solid #f0c0ce;
      border-radius: 14px;
    }

    .confirm-heading {
      font-size: 13px;
      font-weight: 700;
      color: #b5305a;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    /* 送信内容プレビュー */
    .confirm-preview {
      font-size: 14px;
      line-height: 1.8;
      color: #444;
      background: #ffffff;
      border: 1.5px solid #f0c0ce;
      border-radius: 8px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .confirm-actions {
      display: flex;
      gap: 10px;
    }

    /* 確認：キャンセルボタン */
    .cancel-confirm-btn {
      flex: 1;
      padding: 14px 12px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #b5305a;
      background: transparent;
      border: 1.5px solid #f0c0ce;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.04em;
    }

    .cancel-confirm-btn:hover {
      border-color: #e91e8c;
      background: #fff0f5;
    }

    /* 確認：送信確定ボタン */
    .do-send-btn {
      flex: 2;
      padding: 14px 12px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #f06292, #e91e8c);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(233, 30, 140, 0.30);
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.04em;
    }

    .do-send-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(233, 30, 140, 0.40);
    }

    .do-send-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .do-send-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* ブロック追加ボタン */
    #addBlockBtn {
      display: block;
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #e91e8c;
      background: transparent;
      border: 2px dashed #f0c0ce;
      border-radius: 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.05em;
    }

    #addBlockBtn:hover {
      border-color: #e91e8c;
      background: #fff0f5;
    }

    /* フィードバックメッセージ */
    #feedback {
      margin-top: 20px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      min-height: 24px;
    }

    #feedback.success { color: #2e7d32; }
    #feedback.error   { color: #c62828; }
    #feedback.warn    { color: #e65100; }
    #feedback:empty   { display: none; }

    .footer {
      margin-top: 32px;
      font-size: 11px;
      color: #ccc;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <p class="card-title">通知文を編集して送信</p>

    <!-- 通知ブロック一覧（JSで動的に生成） -->
    <div id="blockList"></div>

    <!-- ブロック追加ボタン -->
    <button id="addBlockBtn">＋ 通知ブロックを追加</button>

    <div id="feedback"></div>
  </div>

  <p class="footer">kotorinosu-api デモ管理画面</p>

  <script>
    const API_ENDPOINT  = 'https://kotorinosu-api.vercel.app/api/line-notify';
    const STORAGE_KEY   = 'kotorinosu_blocks';
    const DEFAULT_TEXT  = 'タイトル\n\n本文';

    const blockList  = document.getElementById('blockList');
    const addBlockBtn = document.getElementById('addBlockBtn');
    const feedback   = document.getElementById('feedback');

    // フィードバック表示
    function showFeedback(message, type) {
      feedback.textContent = message;
      feedback.className = type;
    }

    // ---- ブロックデータの永続化 ----

    function loadBlocks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(saved) && saved.length > 0) return saved;
      } catch { /* 無視 */ }
      return [{ id: String(Date.now()), text: DEFAULT_TEXT }];
    }

    // DOMから現在のブロック状態を読み取ってlocalStorageに保存
    function saveBlocks() {
      const blocks = [...blockList.querySelectorAll('.notify-block')].map(el => ({
        id: el.dataset.id,
        text: el.querySelector('.block-textarea').value,
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(blocks));
    }

    // ブロックが1つのとき削除ボタンを非表示にする
    function updateDeleteButtons() {
      const blocks = blockList.querySelectorAll('.notify-block');
      const showDelete = blocks.length > 1;
      blocks.forEach(block => {
        block.querySelector('.block-delete-btn').style.display = showDelete ? '' : 'none';
      });
    }

    // ---- ブロック生成 ----

    function createBlock(block) {
      const wrapper = document.createElement('div');
      wrapper.className = 'notify-block';
      wrapper.dataset.id = block.id;

      // --- 削除ボタン行 ---
      const blockTop = document.createElement('div');
      blockTop.className = 'block-top';

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'block-delete-btn';
      deleteBtn.textContent = '削除';
      deleteBtn.addEventListener('click', () => {
        wrapper.remove();
        saveBlocks();
        updateDeleteButtons();
      });
      blockTop.appendChild(deleteBtn);

      // --- テキストエリア ---
      const textarea = document.createElement('textarea');
      textarea.className = 'block-textarea';
      textarea.value = block.text;
      textarea.addEventListener('input', saveBlocks);

      // --- 送信エリア ---
      const sendArea = document.createElement('div');
      sendArea.className = 'send-area';

      const sendBtn = document.createElement('button');
      sendBtn.className = 'send-btn';
      sendBtn.textContent = '🎂 この内容で送信する';

      // --- 確認パネル ---
      const confirmPanel = document.createElement('div');
      confirmPanel.className = 'confirm-panel';
      confirmPanel.innerHTML = `
        <div class="confirm-inner">
          <p class="confirm-heading">📨 この内容を送信しますか？</p>
          <div class="confirm-preview"></div>
          <div class="confirm-actions">
            <button class="cancel-confirm-btn">キャンセル</button>
            <button class="do-send-btn">✓ 送信する</button>
          </div>
        </div>
      `;

      const confirmPreview = confirmPanel.querySelector('.confirm-preview');
      const cancelBtn      = confirmPanel.querySelector('.cancel-confirm-btn');
      const doSendBtn      = confirmPanel.querySelector('.do-send-btn');

      function openConfirm(text) {
        confirmPreview.textContent = text;
        sendBtn.classList.add('hidden');
        confirmPanel.classList.add('visible');
        setTimeout(() => doSendBtn.focus(), 300);
      }

      function closeConfirm() {
        confirmPanel.classList.remove('visible');
        sendBtn.classList.remove('hidden');
      }

      // 送信ボタン → 確認パネルを展開
      sendBtn.addEventListener('click', () => {
        const text = textarea.value.trim();
        if (!text) {
          showFeedback('文章を入力してください', 'warn');
          textarea.focus();
          return;
        }
        feedback.textContent = '';
        feedback.className   = '';
        openConfirm(text);
      });

      // キャンセル
      cancelBtn.addEventListener('click', closeConfirm);

      // 送信確定
      doSendBtn.addEventListener('click', async () => {
        const text = confirmPreview.textContent;
        doSendBtn.disabled = true;
        cancelBtn.disabled = true;

        try {
          const res = await fetch(API_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text }),
          });

          if (res.ok) {
            closeConfirm();
            showFeedback('✅ 送信しました！', 'success');
          } else {
            const data = await res.json().catch(() => ({}));
            console.error('API エラー:', data);
            showFeedback('❌ 送信に失敗しました', 'error');
            closeConfirm();
          }
        } catch (err) {
          console.error('通信エラー:', err);
          showFeedback('❌ 送信に失敗しました', 'error');
          closeConfirm();
        } finally {
          doSendBtn.disabled = false;
          cancelBtn.disabled = false;
        }
      });

      sendArea.appendChild(sendBtn);
      sendArea.appendChild(confirmPanel);

      wrapper.appendChild(blockTop);
      wrapper.appendChild(textarea);
      wrapper.appendChild(sendArea);

      return wrapper;
    }

    // 全ブロックを描画
    function renderBlocks() {
      blockList.innerHTML = '';
      loadBlocks().forEach(block => blockList.appendChild(createBlock(block)));
      updateDeleteButtons();
    }

    // ブロック追加
    addBlockBtn.addEventListener('click', () => {
      const newBlock = { id: String(Date.now()), text: '' };
      const el = createBlock(newBlock);
      blockList.appendChild(el);
      saveBlocks();
      updateDeleteButtons();
      // 追加したブロックのテキストエリアへスクロール＆フォーカス
      el.querySelector('.block-textarea').focus();
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    // ESCキーで開いている確認パネルをすべて閉じる
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      blockList.querySelectorAll('.confirm-panel.visible').forEach(panel => {
        panel.classList.remove('visible');
        panel.closest('.send-area').querySelector('.send-btn').classList.remove('hidden');
      });
    });

    // 初期描画
    renderBlocks();
  </script>

</body>
</html>
