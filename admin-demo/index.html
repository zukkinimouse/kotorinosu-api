<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>フードロス通知 | 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #fff9f5 0%, #fce8ec 100%);
      padding: 24px 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(220, 80, 120, 0.12);
      padding: 36px 28px;
      width: 100%;
      max-width: 520px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: #b5305a;
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 0.04em;
    }

    /* テキストエリア */
    #messageText {
      width: 100%;
      min-height: 180px;
      padding: 16px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 16px;
      line-height: 1.9;
      color: #333;
      background: #fff8fa;
      border: 2px solid #f0c0ce;
      border-radius: 12px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease;
    }

    #messageText:focus {
      border-color: #e91e8c;
    }

    /* ショートカットエリア */
    .shortcuts-area {
      margin-top: 20px;
    }

    .shortcuts-section-label {
      font-size: 11px;
      font-weight: 700;
      color: #b5305a;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .shortcuts-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
    }

    /* ショートカットボタン本体（既存の送信ボタンと同デザイン・小サイズ） */
    .shortcut-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #f06292, #e91e8c);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(233, 30, 140, 0.28);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.04em;
    }

    .shortcut-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(233, 30, 140, 0.38);
    }

    .shortcut-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(233, 30, 140, 0.22);
    }

    /* ショートカットボタン内の削除アイコン */
    .shortcut-delete {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      font-size: 9px;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .shortcut-delete:hover {
      background: rgba(255, 255, 255, 0.52);
    }

    /* ＋追加ボタン */
    .add-shortcut-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #e91e8c;
      background: transparent;
      border: 2px dashed #f0c0ce;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.04em;
    }

    .add-shortcut-btn:hover {
      border-color: #e91e8c;
      background: #fff0f5;
    }

    /* ショートカット追加フォーム */
    .shortcut-form {
      display: none;
      margin-top: 12px;
      padding: 16px;
      background: #fff8fa;
      border: 1.5px solid #f0c0ce;
      border-radius: 12px;
    }

    .shortcut-form.visible {
      display: block;
    }

    .shortcut-form-row {
      margin-bottom: 8px;
    }

    .shortcut-form input,
    .shortcut-form textarea {
      width: 100%;
      padding: 10px 12px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px;
      color: #333;
      background: #ffffff;
      border: 1.5px solid #f0c0ce;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .shortcut-form input:focus,
    .shortcut-form textarea:focus {
      border-color: #e91e8c;
    }

    .shortcut-form textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.7;
    }

    .shortcut-form-hint {
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
    }

    .shortcut-form-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .btn-save-shortcut {
      padding: 9px 22px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #f06292, #e91e8c);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(233, 30, 140, 0.25);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn-save-shortcut:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(233, 30, 140, 0.35);
    }

    .btn-cancel-shortcut {
      padding: 9px 18px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #b5305a;
      background: transparent;
      border: 1.5px solid #f0c0ce;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-cancel-shortcut:hover {
      border-color: #e91e8c;
      background: #fff0f5;
    }

    /* 送信エリア全体（ボタン ↔ 確認パネルを内包） */
    .send-area {
      margin-top: 20px;
    }

    /* 送信ボタン */
    #sendBtn {
      display: block;
      width: 100%;
      padding: 20px 16px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #f06292, #e91e8c);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(233, 30, 140, 0.30);
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.22s ease, max-height 0.22s ease;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.05em;
      overflow: hidden;
      max-height: 80px;
    }

    #sendBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(233, 30, 140, 0.38);
    }

    #sendBtn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 3px 12px rgba(233, 30, 140, 0.25);
    }

    #sendBtn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* 送信ボタンを確認パネル表示中は縮小して非表示 */
    #sendBtn.hidden {
      opacity: 0;
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      pointer-events: none;
    }

    /* 確認パネル */
    #confirmPanel {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.25s ease;
    }

    #confirmPanel.visible {
      max-height: 400px;
      opacity: 1;
    }

    .confirm-inner {
      padding: 20px;
      background: #fff8fa;
      border: 1.5px solid #f0c0ce;
      border-radius: 14px;
    }

    .confirm-heading {
      font-size: 13px;
      font-weight: 700;
      color: #b5305a;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    /* 送信内容プレビュー */
    .confirm-preview {
      font-size: 14px;
      line-height: 1.8;
      color: #444;
      background: #ffffff;
      border: 1.5px solid #f0c0ce;
      border-radius: 8px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .confirm-actions {
      display: flex;
      gap: 10px;
    }

    /* 確認パネル：キャンセルボタン */
    #cancelConfirmBtn {
      flex: 1;
      padding: 14px 12px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #b5305a;
      background: transparent;
      border: 1.5px solid #f0c0ce;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.04em;
    }

    #cancelConfirmBtn:hover {
      border-color: #e91e8c;
      background: #fff0f5;
    }

    /* 確認パネル：送信確定ボタン */
    #confirmSendBtn {
      flex: 2;
      padding: 14px 12px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #f06292, #e91e8c);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(233, 30, 140, 0.30);
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.04em;
    }

    #confirmSendBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(233, 30, 140, 0.40);
    }

    #confirmSendBtn:active:not(:disabled) {
      transform: translateY(1px);
    }

    #confirmSendBtn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* フィードバックメッセージ */
    #feedback {
      margin-top: 20px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      min-height: 24px;
    }

    #feedback.success {
      color: #2e7d32;
    }

    #feedback.error {
      color: #c62828;
    }

    #feedback.warn {
      color: #e65100;
    }

    #feedback:empty {
      display: none;
    }

    .footer {
      margin-top: 32px;
      font-size: 11px;
      color: #ccc;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <p class="card-title">通知文を編集して送信</p>

    <textarea id="messageText">🎂 本日17時のお知らせ

いちごショート・モンブランが
各2個残っています。
18時閉店です。お早めにどうぞ！</textarea>

    <!-- ショートカットエリア -->
    <div class="shortcuts-area">
      <div class="shortcuts-section-label">ショートカット</div>
      <div class="shortcuts-list" id="shortcutsList">
        <!-- ショートカットボタンはJSで動的に挿入 -->
        <button class="add-shortcut-btn" id="addShortcutBtn">＋ 追加</button>
      </div>

      <!-- ショートカット追加フォーム -->
      <div class="shortcut-form" id="shortcutForm">
        <div class="shortcut-form-row">
          <input
            type="text"
            id="shortcutLabel"
            placeholder="ボタン名（例: 🎂 ケーキ残りわずか）"
            maxlength="30"
          />
          <p class="shortcut-form-hint">ボタンに表示するラベルを入力してください</p>
        </div>
        <div class="shortcut-form-row">
          <textarea
            id="shortcutText"
            placeholder="送信する文章を入力..."
          ></textarea>
          <p class="shortcut-form-hint">このボタンをクリックしたとき入力欄にセットされる文章です</p>
        </div>
        <div class="shortcut-form-actions">
          <button class="btn-cancel-shortcut" id="cancelShortcutBtn">キャンセル</button>
          <button class="btn-save-shortcut" id="saveShortcutBtn">保存する</button>
        </div>
      </div>
    </div>

    <!-- 送信エリア（ボタン ↔ 確認パネルの切り替え） -->
    <div class="send-area">
      <button id="sendBtn">🎂 この内容で送信する</button>

      <!-- 確認パネル（送信ボタン押下後に展開） -->
      <div id="confirmPanel">
        <div class="confirm-inner">
          <p class="confirm-heading">📨 この内容を送信しますか？</p>
          <div class="confirm-preview" id="confirmPreview"></div>
          <div class="confirm-actions">
            <button id="cancelConfirmBtn">キャンセル</button>
            <button id="confirmSendBtn">✓ 送信する</button>
          </div>
        </div>
      </div>
    </div>

    <div id="feedback"></div>
  </div>

  <p class="footer">kotorinosu-api デモ管理画面</p>

  <script>
    const API_ENDPOINT  = 'https://kotorinosu-api.vercel.app/api/line-notify';
    const STORAGE_KEY   = 'kotorinosu_shortcuts';

    const sendBtn           = document.getElementById('sendBtn');
    const messageText       = document.getElementById('messageText');
    const feedback          = document.getElementById('feedback');
    const shortcutsList     = document.getElementById('shortcutsList');
    const addShortcutBtn    = document.getElementById('addShortcutBtn');
    const shortcutForm      = document.getElementById('shortcutForm');
    const shortcutLabelInput = document.getElementById('shortcutLabel');
    const shortcutTextInput = document.getElementById('shortcutText');
    const cancelShortcutBtn = document.getElementById('cancelShortcutBtn');
    const saveShortcutBtn   = document.getElementById('saveShortcutBtn');

    // フィードバック表示ユーティリティ
    function showFeedback(message, type) {
      feedback.textContent = message;
      feedback.className = type; // 'success' | 'error' | 'warn'
    }

    // ---- ショートカット管理 ----

    function loadShortcuts() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveShortcutsToStorage(shortcuts) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(shortcuts));
    }

    function renderShortcuts() {
      // 既存のショートカットボタンをリセット（追加ボタンは残す）
      shortcutsList.querySelectorAll('.shortcut-btn').forEach(el => el.remove());

      const shortcuts = loadShortcuts();
      shortcuts.forEach((sc, index) => {
        const btn = document.createElement('button');
        btn.className = 'shortcut-btn';
        btn.dataset.index = index;
        btn.innerHTML =
          `<span class="shortcut-label-text">${escapeHtml(sc.label)}</span>` +
          `<span class="shortcut-delete" data-index="${index}" title="削除">✕</span>`;

        btn.addEventListener('click', (e) => {
          const deleteEl = e.target.closest('.shortcut-delete');
          if (deleteEl) {
            // 削除処理
            const idx = parseInt(deleteEl.dataset.index, 10);
            const arr = loadShortcuts();
            arr.splice(idx, 1);
            saveShortcutsToStorage(arr);
            renderShortcuts();
          } else {
            // テキストエリアにプリセット文章をセット
            messageText.value = sc.text;
            messageText.focus();
          }
        });

        // 追加ボタンの直前に挿入
        shortcutsList.insertBefore(btn, addShortcutBtn);
      });
    }

    // XSS対策: HTMLエスケープ
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ショートカット追加フォームの開閉
    addShortcutBtn.addEventListener('click', () => {
      shortcutForm.classList.add('visible');
      shortcutLabelInput.focus();
      addShortcutBtn.style.display = 'none';
    });

    cancelShortcutBtn.addEventListener('click', () => {
      closeShortcutForm();
    });

    saveShortcutBtn.addEventListener('click', () => {
      const label = shortcutLabelInput.value.trim();
      const text  = shortcutTextInput.value.trim();

      if (!label) {
        shortcutLabelInput.focus();
        return;
      }
      if (!text) {
        shortcutTextInput.focus();
        return;
      }

      const shortcuts = loadShortcuts();
      shortcuts.push({ label, text });
      saveShortcutsToStorage(shortcuts);
      renderShortcuts();
      closeShortcutForm();
    });

    function closeShortcutForm() {
      shortcutForm.classList.remove('visible');
      shortcutLabelInput.value = '';
      shortcutTextInput.value  = '';
      addShortcutBtn.style.display = '';
    }

    // ---- 送信処理 ----

    const confirmPanel    = document.getElementById('confirmPanel');
    const confirmPreview  = document.getElementById('confirmPreview');
    const cancelConfirmBtn = document.getElementById('cancelConfirmBtn');
    const confirmSendBtn  = document.getElementById('confirmSendBtn');

    // 確認パネルを開く
    function openConfirm(text) {
      confirmPreview.textContent = text;
      sendBtn.classList.add('hidden');
      confirmPanel.classList.add('visible');
      // パネルが見えてからフォーカス（アクセシビリティ）
      setTimeout(() => confirmSendBtn.focus(), 300);
    }

    // 確認パネルを閉じる
    function closeConfirm() {
      confirmPanel.classList.remove('visible');
      sendBtn.classList.remove('hidden');
    }

    // 送信ボタン → 確認パネルを展開
    sendBtn.addEventListener('click', () => {
      const text = messageText.value.trim();

      if (text === '') {
        showFeedback('文章を入力してください', 'warn');
        messageText.focus();
        return;
      }

      feedback.textContent = '';
      feedback.className = '';
      openConfirm(text);
    });

    // キャンセル → パネルを閉じて送信ボタンに戻る
    cancelConfirmBtn.addEventListener('click', () => {
      closeConfirm();
    });

    // ESCキーでもキャンセル可能
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && confirmPanel.classList.contains('visible')) {
        closeConfirm();
      }
    });

    // 確定ボタン → 実際に送信
    confirmSendBtn.addEventListener('click', async () => {
      const text = confirmPreview.textContent;

      confirmSendBtn.disabled = true;
      cancelConfirmBtn.disabled = true;

      try {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });

        if (res.ok) {
          closeConfirm();
          showFeedback('✅ 送信しました！', 'success');
        } else {
          const data = await res.json().catch(() => ({}));
          console.error('API エラー:', data);
          showFeedback('❌ 送信に失敗しました', 'error');
          closeConfirm();
        }
      } catch (err) {
        console.error('通信エラー:', err);
        showFeedback('❌ 送信に失敗しました', 'error');
        closeConfirm();
      } finally {
        confirmSendBtn.disabled = false;
        cancelConfirmBtn.disabled = false;
      }
    });

    // 初期描画
    renderShortcuts();
  </script>

</body>
</html>
